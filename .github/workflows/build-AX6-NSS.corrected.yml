name: Build OpenWRT for AX6-NSS

on:
  workflow_dispatch:

# 新增：显式授予写权限，否则创建/删除 Release 会 403
# （fork 出来的仓库默认是 "Read repository contents and permissions"）
permissions:
  contents: write

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  CONFIG_FILE: AX6-IPQ/.config
  DIY_SH: AX6-IPQ/diy.sh
  FILES: AX6-IPQ/files
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Check machine configuration
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo "云编译建议取消勾选Node.js及其相关插件！"
        echo "已知CPU型号（降序）：7763,8370C,8272CL,8171M,E5系列"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo "--------------------------硬盘信息--------------------------"
        echo -e  "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "硬盘详情："
        df -Th
        
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: "Optimize Disk Space"
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        # 改动：原为 "True"。该选项是"删除系统 swap 文件"，删掉下面的 LVM action 后
        # 就没人再建 swap 了，16G 内存链接大二进制时留着更稳。
        os_swap: "False"

    # 改动：整段替换原来的 easimon/maximize-build-space。
    # 那个 action 通过在 / 上用 fallocate 造镜像文件来做 LVM 卷；当 runner 的 /mnt
    # 不是独立磁盘时，第二个镜像（/mnt/tmp-pv.img）也会落在 / 上，把留给根分区的
    # 余量吃光（只剩 temp-reserve-mb 默认的 100MB），随后 apt 就 ENOSPC。
    - name: Freeing up disk space (manual, no LVM)
      run: |
        echo "== before =="; df -hT /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
        sudo apt-get clean
        sudo docker image prune -af || true
        echo "== after =="; df -hT /

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="
        
    - name: Checkout
      uses: actions/checkout@main
      
    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update -y
        sudo -E apt-get -qq install -y \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3 python3-distutils-extra \
          python3-setuptools rsync swig unzip zlib1g-dev file wget patch subversion
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

    - name: Clone source code
      working-directory: ./
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: cache wrt build
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: AX6-NSS-${{ env.REPO_BRANCH }}
        prefix: ${{ github.workspace }}/openwrt
        
    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom config
      run: |
        [ -e $FILES ] && mv $FILES openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_SH

    # - name: SSH connect to Actions
      # uses: P3TERX/ssh2actions@main
      # if: (github.event.inputs.ssh == 'true') || contains(github.event.action, 'ssh')

    - name: Download package
      working-directory: ./openwrt
      run: |
        make defconfig
        # Linux 6.18 bonding triggers unused-function warnings; defconfig may re-enable WERROR.
        sed -i 's/^CONFIG_KERNEL_WERROR=y$/# CONFIG_KERNEL_WERROR is not set/' .config
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        chmod -R 755 openwrt
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "compile_status=success" >> $GITHUB_ENV

    - name: cp output to upload file
      run: |
        df -hT
        mkdir upload
        cp openwrt/bin/targets/*/*/*.ubi upload/
        cp openwrt/bin/targets/*/*/*.bin upload/

    # 改动：恢复产物上传（原来这段被注释掉了）。加在 Release 之前并带 if: always()，
    # 这样即使发布 Release 再次失败，固件也能从 Actions → Artifacts 下载，不必重编。
    - name: Upload firmware as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: AX6-NSS-${{ github.run_number }}
        path: upload/*
        retention-days: 7

    - name: Get Current Date
      run: echo "CURRENT_DATE=$(date '+%Y%m%d%H%M%S')" >> $GITHUB_ENV
      
    - name: Upload OpenWrt Firmware to Release
      uses: ncipollo/release-action@main
      with:
        tag: AX6_NSS_${{ env.CURRENT_DATE }}
        artifacts: upload/*
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          ## Redmi AX6 · ImmortalWrt (NSS)

          基于 [VIKINGYFY/immortalwrt](https://github.com/VIKINGYFY/immortalwrt) 构建，启用 NSS 硬件加速。

          > 首次使用建议 **清空配置全新刷写**（stock 大分区机型）。

          ### 固件文件
          | 后缀 | 用途 |
          | --- | --- |
          | `.ubi` | 首次刷入 / U-Boot、ubiformat 等写入 NAND |
          | `.bin` | 已在 OpenWrt 上时，网页或 `sysupgrade` 升级用 |

          ### 默认登录
          | 项 | 值 |
          | --- | --- |
          | 地址 | `http://192.168.1.1` |
          | 账户 | `root` |
          | 密码 | 空（首次登录后请自行设置） |

    - name: Delete old releases
      uses: dev-drprasad/delete-older-releases@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        keep_latest: 10
        delete_tags : true
